name: Validate content

on:
  pull_request:
    branches: [main, test]
  push:
    branches: [main, test]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run validate
      # Regression tests for the validator itself. These are self-contained
      # (fixture-based) so they are safe on every PR/push. The index-publication
      # check needs a freshly built index and runs in build-index.yml instead.
      - run: npm run test:internal-links
      - run: npm run test:published-sources
      - run: node scripts/check-code-block-validation.mjs
